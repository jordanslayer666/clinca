<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Clínica Jordan - Sistema profesional de gestión de citas médicas">
  <title>Clínica Jordan - Citas Médicas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LOGIN / REGISTER SCREEN                                 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-bg">
      <div class="auth-bg__shape auth-bg__shape--1"></div>
      <div class="auth-bg__shape auth-bg__shape--2"></div>
      <div class="auth-bg__shape auth-bg__shape--3"></div>
    </div>
    <div class="auth-container" id="authContainer">
      <!-- Content rendered by JS -->
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- APP SHELL (hidden until login)                          -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <div class="app-shell" id="appShell" style="display:none">
    
    <!-- HEADER / NAVBAR -->
    <header class="header" id="mainHeader">
      <div class="header__brand">
        <div class="header__logo">
          <i class="fa-solid fa-staff-snake"></i>
        </div>
        <span class="header__title">Clínica Jordan</span>
      </div>

      <nav class="header__nav" id="mainNav"></nav>

      <div class="header__actions">
        <button class="header__notif-btn" id="notifBtn" title="Notificaciones">
          <i class="fa-solid fa-bell"></i>
          <span class="notif-badge" id="notifBadge" style="display:none">0</span>
        </button>
        <div class="user-menu" id="userMenu">
          <div class="user-avatar">
            <i class="fa-solid fa-user-circle"></i>
          </div>
          <span class="user-name" id="currentUserName">Usuario</span>
          <i class="fa-solid fa-chevron-down"></i>
        </div>
        <button class="btn btn--danger" style="margin-left: 15px; padding: 6px 12px; display: flex; align-items: center; gap: 6px; font-size: 0.85rem;" onclick="logout()" title="Cerrar Sesión">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span class="d-none d-md-inline">Salir</span>
        </button>
      </div>
    </header>

    <!-- SIDEBAR (Patient Portal) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__logo">
        <div class="sidebar__logo-icon">
          <i class="fa-solid fa-staff-snake"></i>
        </div>
        <span class="sidebar__logo-text">Clínica<br>Jordan</span>
      </div>
      <nav class="sidebar__nav" id="sidebarNav"></nav>
      <div class="sidebar__user" id="sidebarUser"></div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main" id="mainContent">
      <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <p>Cargando sistema...</p>
      </div>
    </main>
  </div>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- MODAL                                                   -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal__header">
        <h3 class="modal__title" id="modalTitle">Modal</h3>
        <button class="modal__close" id="modalClose">&times;</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <!-- TOAST NOTIFICATIONS -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- NOTIFICATIONS PANEL -->
  <div class="notif-panel" id="notifPanel">
    <div class="notif-panel__header">
      <h4>Notificaciones</h4>
      <button class="btn btn--sm" id="markAllRead">Marcar leídas</button>
    </div>
    <div class="notif-panel__list" id="notifList"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
